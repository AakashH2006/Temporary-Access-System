# nginx site config for the temporary access gateway.
#
# Install as /etc/nginx/sites-available/temp-access, then:
#   ln -s /etc/nginx/sites-available/temp-access /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Replace access.example.com with your real hostname throughout.
#
# IMPORTANT: this config sets X-Forwarded-For, which the gateway only honours
# when TRUST_PROXY=true is set in its environment. Set both or neither --
# setting neither collapses every visitor into a single rate-limit bucket,
# and setting only TRUST_PROXY lets clients forge their own IP.

# Redirect plain HTTP to HTTPS. Access links are emailed, and an emailed
# http:// link would put a temporary password on the wire in the clear.
server {
    listen 80;
    listen [::]:80;
    server_name access.example.com;

    # Leave this open so certbot can renew.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name access.example.com;

    # Written by: certbot --nginx -d access.example.com
    ssl_certificate     /etc/letsencrypt/live/access.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/access.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    # The gateway hands out time-boxed sessions over this hostname; tell
    # browsers never to try it over plain HTTP again.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The upstream app may serve large files through the gateway. Raise this
    # to match whatever the app itself accepts.
    client_max_body_size 50m;

    # Long enough for slow internal apps, short enough to release sockets.
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;

    # The admin console, restricted by network position. Admins already have
    # VPN access by the premise of this system, so the console never needs to
    # answer the public internet -- and this is the cheapest, strongest control
    # available for the credential that mints access to the internal network.
    #
    # Set ADMIN_IP_ALLOWLIST in .env to the same ranges: the app enforces it
    # independently, so a mistake in this file alone does not expose the
    # console. Both need TRUST_PROXY=true to see the real client IP.
    location ~ ^/__access/(admin|admin-login|api/admin/) {
        allow 10.8.0.0/24;        # VPN range -- replace with yours
        # allow 203.0.113.7;      # a fixed office IP, if you have one
        deny  all;

        proxy_pass http://127.0.0.1:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Websocket support, so apps behind the gateway that use live
        # connections keep working. The gateway re-authorizes each upgrade.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# Required by the Connection header above. Put this in the http{} block if
# your nginx.conf does not already define it:
#
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
